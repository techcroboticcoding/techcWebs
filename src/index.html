<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TECH-C Robotic and Coding Dashboard</title>
</head>

<script>
const token = localStorage.getItem('token');
const role = localStorage.getItem('role');

if (!token) {
  window.location.replace('./login.html');
} else if (role === 'siswa') {
  window.location.replace('./dashboardSiswa.html');
} else if (role !== 'admin') {
  localStorage.clear();
  window.location.replace('./login.html');
}
</script>

<body
  x-data="{ page: 'ecommerce', loaded: true, darkMode: false, stickyMenu: false, sidebarToggle: false, scrollTop: false }"
  x-init="
    darkMode = JSON.parse(localStorage.getItem('darkMode'));
    $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))
  "
  :class="{'dark bg-gray-900': darkMode === true}"
>

  <!-- Preloader -->
  <include src="./partials/preloader.html"></include>

  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <include src="./partials/sidebar.html"></include>


    <!-- Content -->
    <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">

      <include src="./partials/overlay.html"></include>

      <!-- Header -->
      <include src="./partials/header.html"></include>

      <!-- MAIN -->
      <main class="p-6 bg-gray-50 dark:bg-gray-900 min-h-screen">

        <!-- Statistik -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-6">

          <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow">
            <p class="text-sm text-gray-500">Total Pelajar</p>
            <h2 id="pelajar" class="text-2xl font-bold text-gray-800 dark:text-white">0</h2>
          </div>

          <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow">
            <p class="text-sm text-gray-500">Total Pendaftaran</p>
            <h2 id="pendaftaran" class="text-2xl font-bold text-gray-800 dark:text-white">0</h2>
          </div>

          <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow">
            <p class="text-sm text-gray-500">Total Pelajaran</p>
            <h2 id="pelajaran" class="text-2xl font-bold text-gray-800 dark:text-white">0</h2>
          </div>

          <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow">
            <p class="text-sm text-gray-500">Pendapatan</p>
            <h2 id="pendapatan" class="text-2xl font-bold text-green-500">0</h2>
          </div>

        </div>

        <!-- Chart (FIX ERROR CHART.JS) -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow h-[300px]">
          <canvas id="studentChart"></canvas>
        </div>

      </main>
    </div>
  </div>

  <!-- LOAD PARTIAL -->
  <script>
  async function loadPartials() {
    const includes = document.querySelectorAll('include');

    for (let el of includes) {
      const file = el.getAttribute('src');
      try {
        const res = await fetch(file);
        const html = await res.text();
        el.outerHTML = html;
      } catch (e) {
        console.error("Gagal load:", file);
      }
    }
  }

  loadPartials();
  </script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- DASHBOARD SCRIPT -->

  
  <script>
  let chart;

  function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.innerText = value;
  }
const API_BASE = 'http://localhost:8000/api';

async function apiGet(path) {
  const token = localStorage.getItem('token');

  const res = await fetch(`${API_BASE}${path}`, {
    method: 'GET',
    headers: {
      'Accept': 'application/json',
      'Authorization': `Bearer ${token}`
    }
  });

  if (res.status === 401) {
    localStorage.clear();
    window.location.href = './login.html';
    return null;
  }
}
async function loadChart() {
  try {
    const data = await apiGet('/dashboard');
    if (!data) return;

    const ctx = document.getElementById('studentChart');
    if (!ctx) return;

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.chart?.labels || [],
        datasets: [{
          label: 'Students',
          data: data.chart?.data || [],
          borderWidth: 2,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });

  } catch (err) {
    console.error("Chart error:", err);
  }
}

async function loadDashboard() {
  try {
    const data = await apiGet('/dashboard');
    if (!data) return;

    console.log(data);

    setText('pelajar', data.totalPelajar ?? 0);
    setText('pendaftaran', data.pemesananSiswa ?? 0);
    setText('pelajaran', data.totalPelajaran ?? 0);
    setText('pendapatan', "IDR " + (data.pendapatan ?? 0));

    setText('tagihan', data.tagihanBelumDibayar ?? 0);
    setText('penggantian', data.permintaanPenggantian ?? 0);
    setText('pemesanan', data.pemesananSiswa ?? 0);
    setText('pengumuman', data.pengumuman ?? 0);

  } catch (err) {
    console.error("API error:", err);
  }
}

  </script>

</body>
</html>
