<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TECH-C</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg">
    
    <h2 class="text-2xl font-bold text-center mb-6">Login TECH-C</h2>

    <form id="loginForm" class="space-y-4">

      <div>
        <label class="block text-sm mb-1">Email</label>
        <input type="email" id="email"
          class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200"
          placeholder="email@gmail.com" required>
      </div>

      <div>
        <label class="block text-sm mb-1">Password</label>
        <input type="password" id="password"
          class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200"
          placeholder="********" required>
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
        Login
      </button>

      <p id="error" class="text-red-500 text-sm text-center hidden"></p>

    </form>

  </div>

  <!-- SCRIPT LOGIN -->
  <script>
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');

    try {
const res = await fetch('http://103.171.158.7:8000/api/login', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json',
    'Accept': 'application/json'
  },
  body: JSON.stringify({ email, password })
});

      const data = await res.json();

      if (res.ok) {
        // simpan token

  localStorage.setItem('token', data.token);
  localStorage.setItem('role', data.role);
  localStorage.setItem('name', data.name);

  // redirect sesuai role
  if (data.role === 'admin') {
    window.location.href = 'index.html';
  } else if (data.role === 'siswa') {
    window.location.href = 'dashboardSiswa.html';
  } else {
    errorEl.innerText = 'Role tidak valid';
    errorEl.classList.remove('hidden');
  }

      } else {
        errorEl.innerText = data.message || 'Login gagal';
        errorEl.classList.remove('hidden');
      }

    } catch (err) {
      errorEl.innerText = 'Server error';
      errorEl.classList.remove('hidden');
    }
  });
  </script>

</body>
</html>
