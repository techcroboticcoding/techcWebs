

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Tech-C Scratch Learning
</title>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#f1f5f9;

color:#1e293b;

}



/* HEADER */

.header{

height:70px;

background:#ffffff;

display:flex;

align-items:center;

padding:0 30px;

box-shadow:
0 2px 10px #0001;

position:fixed;

top:0;

left:0;

right:0;

z-index:10;

}



.logo{

font-size:22px;

font-weight:800;

color:#2563eb;

}



.subtitle{

margin-left:15px;

color:#64748b;

}



/* SIDEBAR */


.sidebar{

position:fixed;

top:70px;

left:0;

bottom:0;

width:280px;

background:white;

padding:20px;

overflow:auto;

border-right:1px solid #e2e8f0;

}



.search{

width:100%;

padding:12px;

border-radius:12px;

border:1px solid #cbd5e1;

margin-bottom:15px;

}



.lesson{

padding:12px;

border-radius:12px;

cursor:pointer;

margin-bottom:8px;

background:#f8fafc;

}



.lesson:hover{

background:#dbeafe;

}



.lesson.active{

background:#2563eb;

color:white;

}



/* CONTENT */


.main{

margin-left:280px;

padding:100px 35px 40px;

}



.dashboard{

display:flex;

gap:20px;

margin-bottom:25px;

}



.stat{

background:white;

padding:20px;

border-radius:20px;

flex:1;

box-shadow:
0 5px 20px #0001;

}



.stat h2{

margin:0;

color:#2563eb;

}



/* CARD */


.card{

background:white;

padding:30px;

border-radius:25px;

box-shadow:
0 10px 30px #0002;

}



.title{

font-size:30px;

font-weight:800;

margin-bottom:10px;

}



.konsep{

background:#eff6ff;

padding:15px;

border-radius:15px;

}



.viewer{

text-align:center;

margin-top:25px;

}



.viewer img{

max-width:90%;

max-height:650px;

border-radius:18px;

box-shadow:
0 10px 25px #0002;

}



.control{

margin-top:20px;

}



button{

border:none;

background:#2563eb;

color:white;

padding:12px 22px;

border-radius:14px;

font-weight:700;

cursor:pointer;

}



button:hover{

background:#1d4ed8;

}



.done{

background:#16a34a;

}



.page{

font-weight:bold;

margin:0 15px;

}



.scratch{

display:inline-block;

margin-top:20px;

text-decoration:none;

}



.progress{

height:12px;

background:#e2e8f0;

border-radius:20px;

overflow:hidden;

}



.progress div{

height:100%;

background:#2563eb;

width:0%;

}



@media(max-width:800px){


.sidebar{

width:100%;

height:auto;

position:relative;

top:70px;

}


.main{

margin-left:0;

padding-top:100px;

}


.dashboard{

flex-direction:column;

}


}




</style>


</head>


<body>



<div class="header">


<div class="logo">

TECH-C Learning

</div>


<div class="subtitle">

Scratch Programming

</div>


</div>





<div class="sidebar">


<input id="search"
class="search"
placeholder="Cari materi..."
onkeyup="searchLesson()">



<div id="lessonList">

</div>


</div>





<div class="main">



<div class="dashboard">


<div class="stat">

<h2 id="total">

0

</h2>

Materi

</div>



<div class="stat">

<h2 id="complete">

0

</h2>

Selesai

</div>



<div class="stat">


<h2 id="percent">

0%

</h2>

Progress


<div class="progress">

<div id="bar">

</div>

</div>


</div>


</div>






<div class="card">


<div class="title"
id="title">

</div>


<div class="konsep"
id="concept">

</div>



<div class="viewer">


<img id="pageImage">



<div class="control">


<button onclick="previousPage()">

← Sebelumnya

</button>



<span class="page"
id="pageNumber">

</span>



<button onclick="nextPage()">

Berikutnya →

</button>


</div>



<a id="scratchLink"
class="scratch"
target="_blank">


<button>

Buka Project Scratch

</button>


</a>


<br><br>


<button class="done"
onclick="finishLesson()">

✓ Tandai Selesai

</button>


</div>



</div>



</div>





<script>


let materi=[];

let current=0;

let page=0;



fetch("data.json")

.then(res=>res.json())

.then(data=>{


materi=data;


document.getElementById(
"total"
).innerHTML=materi.length;


loadStorage();

createMenu();

loadLesson();


});





function createMenu(){


let html="";


materi.forEach((m,i)=>{


html+=`

<div class="lesson"
onclick="openLesson(${i})">

${i+1}. ${m.judul}

</div>

`;


});


document.getElementById(
"lessonList"
).innerHTML=html;


}





function openLesson(i){


current=i;

page=0;

loadLesson();


}




function loadLesson(){


let m=materi[current];


document.getElementById(
"title"
).innerHTML=
m.judul;



document.getElementById(
"concept"
).innerHTML=
"Konsep : "+m.konsep;



document.getElementById(
"scratchLink"
).href=m.link;



document.getElementById(
"pageImage"
).src=
m.pages[page];



document.getElementById(
"pageNumber"
).innerHTML=

(page+1)
+
" / "
+
m.pages.length;


updateProgress();


}




function nextPage(){


if(page < materi[current].pages.length-1)

page++;


loadLesson();


}





function previousPage(){


if(page>0)

page--;


loadLesson();


}




function finishLesson(){


materi[current].completed=true;


saveStorage();


updateProgress();


}



function saveStorage(){


localStorage.setItem(
"techc_scratch",
JSON.stringify(materi)
);


}



function loadStorage(){


let save =
localStorage.getItem(
"techc_scratch"
);


if(save){

materi =
JSON.parse(save);

}


}





function updateProgress(){


let done =
materi.filter(
x=>x.completed
).length;



document.getElementById(
"complete"
).innerHTML=done;



let persen =
Math.round(
(done/materi.length)*100
);



document.getElementById(
"percent"
).innerHTML=
persen+"%";



document.getElementById(
"bar"
).style.width=
persen+"%";

}




function searchLesson(){


let key =
document.getElementById(
"search"
).value
.toLowerCase();



document
.querySelectorAll(
".lesson"
)
.forEach((el,i)=>{


el.style.display =
materi[i].judul
.toLowerCase()
.includes(key)

?

"block"

:

"none";


});


}



</script>


</body>

</html>
