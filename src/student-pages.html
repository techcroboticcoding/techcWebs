  async function loadPartials() {
    const includes = document.querySelectorAll('include');

    for (let el of includes) {
      const file = el.getAttribute('src');

      try {
        const res = await fetch(file);
        const html = await res.text();
        el.outerHTML = html;
      } catch (e) {
        console.error("Gagal load partial:", file, e);
      }
    }
  }
  </script>

  <script>
const PRODUCTION_API_BASE = 'https://techcwebs-production.up.railway.app/api';
const LOCAL_API_BASE = 'http://127.0.0.1:8000/api';

function isLocalFrontend() {
  return (
    window.location.hostname === 'localhost' ||
    window.location.hostname === '127.0.0.1' ||
    window.location.hostname === ''
  );
}

function getApiBase() {
  const saved = localStorage.getItem('api_base');

  if (isLocalFrontend()) {
    return saved || LOCAL_API_BASE;
  }

  if (
    saved &&
    !saved.includes('127.0.0.1') &&
    !saved.includes('localhost')
  ) {
    return saved;
  }

  localStorage.setItem('api_base', PRODUCTION_API_BASE);
  return PRODUCTION_API_BASE;
}

const API_BASE = getApiBase();

  const pageKey = new URLSearchParams(window.location.search).get('page') || 'progress';

  const pageMap = {
    progress: {
      title: 'Progress Belajar',
      subtitle: 'Pantau perkembangan belajar, persentase progress, dan catatan pembimbing.',
      icon: '📈'
    },
    jadwal: {
      title: 'Jadwal Kelas',
      subtitle: 'Lihat jadwal private class, materi, dan status kelas berikutnya.',
      icon: '🗓️'
    },
    tagihan: {
      title: 'Tagihan',
      subtitle: 'Lihat invoice, status pembayaran, total tagihan, dan riwayat pembayaran.',
      icon: '🧾'
    },
    pengumuman: {
      title: 'Pengumuman',
      subtitle: 'Informasi terbaru dari TECH-C untuk siswa dan orang tua.',
      icon: '📢'
    },
    catatan: {
      title: 'Catatan Guru',
      subtitle: 'Catatan pembimbing untuk perkembangan belajar siswa.',

    },
    materi: {
      title: 'Materi Belajar',
      subtitle: 'Kumpulan materi belajar, link, file, video, dan dokumentasi pembelajaran.',
      icon: '📚'
    },
    sertifikat: {
      title: 'Sertifikat',
      subtitle: 'Daftar sertifikat siswa yang sudah terbit.',

    },
    dokumentasi: {
      title: 'Dokumentasi Kelas',
      subtitle: 'Galeri JPG dokumentasi belajar siswa yang tersimpan di Laravel.',
      icon: '🖼️'
    },
    profile: {
      title: 'Profile Siswa',
      subtitle: 'Informasi akun, data siswa, kelas, dan asal sekolah.',
      icon: '👤'
    },
    bantuan: {

      subtitle: 'Kirim pertanyaan atau kendala ke admin TECH-C.',
      icon: '❓'
    }
  };

  function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.innerText = value;
  }

  function getNumber(value, fallback = 0) {
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  }
function getBackendBaseUrl() {
  return API_BASE.replace('/api', '').replace('http://', 'https://');
}

function getDocumentationImageUrl(doc) {
  const backendBase = getBackendBaseUrl();

  let raw =
    doc.image_url ||
    doc.url ||
    doc.file_url ||
    doc.file ||
    doc.image_path ||
    doc.image ||
    doc.photo ||
    doc.path ||
    '';

  if (!raw) {
    return 'https://placehold.co/900x500/e2e8f0/64748b?text=Dokumentasi+TECH-C';
  }

  raw = String(raw);

  // Paksa image dari Railway jadi HTTPS
  if (raw.startsWith('http://techcwebs-production.up.railway.app')) {
    return raw.replace('http://', 'https://');
  }

  if (raw.startsWith('https://')) {
    return raw;
  }

  if (raw.startsWith('http://')) {
    return raw.replace('http://', 'https://');
  }

  if (raw.startsWith('/storage/')) {
    return `${backendBase}${raw}`;
  }

  if (raw.startsWith('storage/')) {
    return `${backendBase}/${raw}`;
  }

  return `${backendBase}/storage/${raw}`;
}
  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function formatRupiah(value) {
    const number = getNumber(value, 0);

    return new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      maximumFractionDigits: 0
    }).format(number);
  }

  function parseMaybeJson(value, fallback = []) {
    if (Array.isArray(value)) return value;
    if (!value) return fallback;

    if (typeof value === 'string') {
      try {
        const parsed = JSON.parse(value);
        return Array.isArray(parsed) ? parsed : fallback;
      } catch {
        return fallback;
      }
    }

    return fallback;
  }

  function setApiStatus(text, type = 'loading') {
    const el = document.getElementById('apiStatus');
    if (!el) return;

    el.innerText = text;
    el.className = 'mt-1 text-sm font-black';

    if (type === 'success') {
      el.classList.add('text-green-500');
    } else if (type === 'error') {
      el.classList.add('text-red-500');
    } else {
      el.classList.add('text-yellow-500');
    }
  }

  async function apiGet(path) {
    const res = await fetch(`${API_BASE}${path}`, {
      method: 'GET',
headers: {
  'Accept': 'application/json',
  'Authorization': `Bearer ${localStorage.getItem('token')}`,
  'X-User-Id': localStorage.getItem('user_id') || '',
  'X-Student-Id': localStorage.getItem('student_id') || '',
  'X-User-Email': localStorage.getItem('email') || '',
  'X-User-Role': localStorage.getItem('role') || 'siswa'
}
    });

    const raw = await res.text();

    let data = null;

    try {
      data = JSON.parse(raw);
    } catch {
      console.error('Response bukan JSON:', raw);
      throw new Error('Response API bukan JSON');
    }

    if (!res.ok) {
      throw new Error(data.message || `HTTP ${res.status}`);
    }

    return data;
  }

  async function apiPost(path, body) {
    const res = await fetch(`${API_BASE}${path}`, {
      method: 'POST',
headers: {
  'Accept': 'application/json',
  'Content-Type': 'application/json',
  'Authorization': `Bearer ${localStorage.getItem('token')}`,
  'X-User-Id': localStorage.getItem('user_id') || '',
  'X-Student-Id': localStorage.getItem('student_id') || '',
  'X-User-Email': localStorage.getItem('email') || '',
  'X-User-Role': localStorage.getItem('role') || 'siswa'
},
      body: JSON.stringify(body)
    });

    const raw = await res.text();

    let data = null;

    try {
      data = JSON.parse(raw);
    } catch {
      data = { message: raw };
    }

    if (!res.ok) {
      throw new Error(data.message || `HTTP ${res.status}`);
    }

    return data;
  }

  function getStudent(dashboard) {
    return dashboard?.student || {};
  }

  function renderSummaryCards(dashboard, invoices = []) {
    const student = getStudent(dashboard);
    const progress = getNumber(dashboard?.progress_belajar ?? student.progress_belajar, 0);

    const unpaid = invoices
      .filter(item => item.status === 'Belum Dibayar')
      .reduce((sum, item) => sum + getNumber(item.total, 0), 0);

    const paidCount = invoices.filter(item => item.status === 'Lunas').length;

    const cards = [
      {
        label: 'Progress',
        value: `${progress}%`,
        desc: 'Perkembangan belajar',
        icon: '📈',
        color: 'blue'
      },
      {
        label: 'Tagihan',
        value: formatRupiah(unpaid),
        desc: 'Belum dibayar',
        icon: '🧾',
        color: 'red'
      },
      {
        label: 'Invoice Lunas',
        value: paidCount,
        desc: 'Pembayaran selesai',
        icon: '✅',
        color: 'green'
      },
      {
        label: 'Status',
        value: student.status || 'Aktif',
        desc: 'Status siswa',
        icon: '⚡',
        color: 'violet'
      }
    ];

    const wrap = document.getElementById('summaryGrid');
    if (!wrap) return;

    wrap.innerHTML = cards.map(card => `
      <div class="relative overflow-hidden rounded-[1.7rem] border border-white/70 bg-white/90 p-5 shadow-xl shadow-slate-200/70 backdrop-blur-xl transition hover:-translate-y-1 hover:shadow-2xl dark:border-slate-800 dark:bg-slate-900/90 dark:shadow-black/20">
        <div class="absolute right-0 top-0 h-28 w-28 rounded-bl-full bg-${card.color}-500/10"></div>

        <div class="relative flex items-start justify-between">
          <div>
            <p class="text-sm font-black text-slate-500 dark:text-slate-400">${card.label}</p>
            <h2 class="mt-3 text-2xl font-black text-slate-900 dark:text-white">${card.value}</h2>
            <p class="mt-2 text-xs font-semibold text-slate-400">${card.desc}</p>
          </div>

          <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-slate-100 text-2xl dark:bg-slate-950">
            ${card.icon}
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderProgress(dashboard) {
    const student = getStudent(dashboard);
    const progress = getNumber(dashboard?.progress_belajar ?? student.progress_belajar, 0);
    const catatan = dashboard?.catatan || student.catatan || 'Belum ada catatan guru.';

    return `
      <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">

        <div class="rounded-[1.5rem] bg-gradient-to-br from-blue-600 to-cyan-500 p-6 text-white lg:col-span-1">
          <p class="text-sm font-bold text-white/80">Progress Belajar</p>
          <h2 class="mt-3 text-5xl font-black">${progress}%</h2>

          <div class="mt-5 h-3 overflow-hidden rounded-full bg-white/30">
            <div class="h-full rounded-full bg-white" style="width: ${progress}%"></div>
          </div>

          <p class="mt-4 text-sm font-semibold text-white/80">
            Siswa sedang mengikuti program ${escapeHtml(student.kategori_level || student.kelas || 'Private Class')}.
          </p>
        </div>

        <div class="rounded-[1.5rem] bg-slate-50 p-6 dark:bg-slate-950 lg:col-span-2">
          <p class="text-lg font-black text-slate-900 dark:text-white">Catatan Perkembangan</p>
          <p class="mt-3 text-sm leading-7 text-slate-500 dark:text-slate-400">${escapeHtml(catatan)}</p>

          <div class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-3">
            <div class="rounded-2xl bg-white p-4 dark:bg-slate-900">
              <p class="text-xs font-bold text-slate-400">Nama</p>
              <p class="mt-1 text-sm font-black text-slate-900 dark:text-white">${escapeHtml(student.name || '-')}</p>
            </div>

            <div class="rounded-2xl bg-white p-4 dark:bg-slate-900">
              <p class="text-xs font-bold text-slate-400">Kelas</p>
              <p class="mt-1 text-sm font-black text-slate-900 dark:text-white">${escapeHtml(student.kelas || '-')}</p>
            </div>

            <div class="rounded-2xl bg-white p-4 dark:bg-slate-900">
              <p class="text-xs font-bold text-slate-400">Sekolah</p>
              <p class="mt-1 text-sm font-black text-slate-900 dark:text-white">${escapeHtml(student.school?.nama || student.school_name || '-')}</p>
            </div>
          </div>
        </div>

      </div>
    `;
  }

  function renderJadwal(dashboard) {
    const student = getStudent(dashboard);
    const jadwal = parseMaybeJson(dashboard?.jadwal || student.jadwal, []);

    if (!jadwal.length) {
      return emptyState('Belum ada jadwal kelas.', 'Jadwal siswa akan muncul setelah admin mengatur jadwal.');
    }

    return `
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        ${jadwal.map((item, index) => `
          <div class="rounded-[1.5rem] border border-slate-100 bg-slate-50 p-5 dark:border-slate-800 dark:bg-slate-950">
            <div class="mb-4 flex items-center justify-between">
              <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-100 text-2xl dark:bg-blue-950">🗓️</div>
              <span class="rounded-full bg-blue-100 px-3 py-1 text-xs font-black text-blue-600 dark:bg-blue-950 dark:text-blue-300">
                Jadwal ${index + 1}
              </span>
            </div>

            <p class="text-lg font-black text-slate-900 dark:text-white">${escapeHtml(item.hari || item.kategori || 'Private Class')}</p>
            <p class="mt-2 text-sm font-semibold text-slate-500 dark:text-slate-400">${escapeHtml(item.jam || item.status || 'Belum dijadwalkan')}</p>
            <p class="mt-3 text-sm leading-6 text-slate-500 dark:text-slate-400">${escapeHtml(item.materi || 'Robotic & Coding')}</p>
          </div>
        `).join('')}
      </div>
    `;
  }
function getInvoiceProofUrl(invoice) {
  const backendBase = API_BASE.replace('/api', '');

  if (invoice.payment_proof_url) {
    return invoice.payment_proof_url;
  }

  const payments = Array.isArray(invoice.payments) ? invoice.payments : [];
  const payment = payments.find(item => item.proof_file || item.proof_url);

  const raw = payment?.proof_url || payment?.proof_file || '';

  if (!raw) return '';

  if (String(raw).startsWith('http')) return raw;
  if (String(raw).startsWith('/storage/')) return `${backendBase}${raw}`;

  return `${backendBase}/storage/${raw}`;
}

function openInvoiceDetail(invoiceId) {
  ensureInvoiceModal();

  const invoice = (window.currentStudentInvoices || []).find(item => String(item.id) === String(invoiceId));

  if (!invoice) return;

  const status = invoice.status || 'Belum Dibayar';
  const proofUrl = getInvoiceProofUrl(invoice);

  setText('modalInvoiceNo', invoice.invoice_no || 'Invoice');
  setText('modalInvoiceDate', `Tanggal: ${invoice.date || '-'}`);
  setText('modalStudentName', invoice.student_name || invoice.student?.name || '-');
  setText('modalStudentClass', invoice.student_class || invoice.student?.kelas || '-');
  setText('modalSubtotal', formatRupiah(invoice.subtotal || 0));
  setText('modalExtra', formatRupiah(invoice.extra_fee || 0));
  setText('modalTotal', formatRupiah(invoice.total || 0));
  setText('modalNote', invoice.note || '-');

  const statusEl = document.getElementById('modalInvoiceStatus');

  if (statusEl) {
    statusEl.innerText = status;
    statusEl.className = 'mt-1 text-sm font-black';

    if (status === 'Lunas') {
      statusEl.classList.add('text-green-600');
    } else if (status === 'Pending') {
      statusEl.classList.add('text-yellow-600');
    } else {
      statusEl.classList.add('text-red-600');
    }
  }

  const items = Array.isArray(invoice.items) && invoice.items.length
    ? invoice.items
    : [
        {
          description: invoice.package_name || 'Kelas Robotic & Coding',
          price: invoice.price_per_meeting || 0,
          qty: invoice.meeting_count || 1,
          total: invoice.main_total || invoice.total || 0
        }
      ];

  const itemWrap = document.getElementById('modalInvoiceItems');

  if (itemWrap) {
    itemWrap.innerHTML = items.map(item => `
      <div class="grid grid-cols-12 border-b border-slate-200 px-4 py-4 text-sm font-bold text-slate-700 dark:border-slate-800 dark:text-slate-300">
        <div class="col-span-5">${escapeHtml(item.description || 'Item')}</div>
        <div class="col-span-2 text-center">${formatRupiah(item.price || 0)}</div>
        <div class="col-span-2 text-center">${item.qty || 1}</div>
        <div class="col-span-3 text-right">${formatRupiah(item.total || 0)}</div>
      </div>
    `).join('');
  }

  const proofWrap = document.getElementById('modalProofWrap');
  const proofImage = document.getElementById('modalProofImage');
  const noProof = document.getElementById('modalNoProof');

  if (proofUrl && status === 'Lunas') {
    proofWrap?.classList.remove('hidden');
    noProof?.classList.add('hidden');

    if (proofImage) {
      proofImage.src = proofUrl;
    }
  } else {
    proofWrap?.classList.add('hidden');
    noProof?.classList.remove('hidden');
  }

  const modal = document.getElementById('invoiceDetailModal');

  if (modal) {
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }
}

function closeInvoiceDetail() {
  const modal = document.getElementById('invoiceDetailModal');

  if (modal) {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }
}

  async function loadPage() {
    const config = pageMap[pageKey] || pageMap.progress;

    setText('pageTitle', `${config.icon} ${config.title}`);
    setText('pageSubtitle', config.subtitle);

    const contentWrap = document.getElementById('contentWrap');

    try {
      setApiStatus('Loading...', 'loading');

      const userId = localStorage.getItem('user_id') || '';
      const dashboard = await apiGet(`/student/dashboard${userId ? `?user_id=${userId}` : ''}`);
      const student = getStudent(dashboard);

const invoices = await safeLoad(`/student/invoices${student.id ? `?student_id=${student.id}` : ''}`, []);
      const profile = await safeLoad('/profile', {});

      const progress = getNumber(dashboard?.progress_belajar ?? student.progress_belajar, 0);

      setText('heroStudentName', student.name || profile.name || '-');
      setText('heroStudentClass', student.kelas || student.kategori_level || '-');
      setText('heroProgress', `${progress}%`);
      setText('heroStatus', student.status || 'Aktif');

      const progressBar = document.getElementById('heroProgressBar');
      if (progressBar) {
        progressBar.style.width = `${Math.min(100, progress)}%`;
      }

      renderSummaryCards(dashboard, invoices);

      let html = '';

      if (pageKey === 'progress') {
        html = renderProgress(dashboard);
      } else if (pageKey === 'jadwal') {
        html = renderJadwal(dashboard);
      } else if (pageKey === 'tagihan') {
        html = renderTagihan(invoices);
      } else if (pageKey === 'pengumuman') {
        html = renderPengumuman(dashboard);
      } else if (pageKey === 'catatan') {
        html = renderCatatan(dashboard);
      } else if (pageKey === 'materi') {
        const materials = await safeLoad('/materials', []);
        html = renderMateri(materials);
      } else if (pageKey === 'sertifikat') {
        const certificates = await safeLoad('/certificates', []);
        html = renderSertifikat(certificates);
      } else if (pageKey === 'dokumentasi') {
        const docs = await safeLoad(`/student/documentations${student.id ? `?student_id=${student.id}` : ''}`, []);
        html = renderDokumentasi(docs);
      } else if (pageKey === 'profile') {
        html = renderProfile(dashboard, profile);
      } else if (pageKey === 'bantuan') {
        html = renderBantuan(dashboard);
      } else {
        html = renderProgress(dashboard);
      }

      if (contentWrap) {
        contentWrap.innerHTML = html;
      }

      bindHelpForm();

      setApiStatus('Connected', 'success');

    } catch (err) {
      console.error('Student page error:', err);
      setApiStatus('Disconnected', 'error');

      if (contentWrap) {
        contentWrap.innerHTML = emptyState('Gagal memuat data.', 'Cek koneksi Laravel API atau buka Console untuk melihat error.');
      }
    }
  }

  async function safeLoad(path, fallback) {
    try {
      return await apiGet(path);
    } catch (err) {
      console.warn('safeLoad gagal:', path, err.message);
      return fallback;
    }
  }

  function bindHelpForm() {
    const form = document.getElementById('helpForm');
    if (!form) return;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const result = document.getElementById('helpResult');

      try {
        const studentId = document.getElementById('helpStudentId')?.value || null;
        const subject = document.getElementById('helpSubject')?.value || '';
        const category = document.getElementById('helpCategory')?.value || 'Umum';
        const message = document.getElementById('helpMessage')?.value || '';

        await apiPost('/help-tickets', {
          student_id: studentId,
          subject,
          category,
          message,
          status: 'Open'
        });

        if (result) {
          result.className = 'mt-4 rounded-2xl bg-green-100 p-4 text-sm font-bold text-green-700 dark:bg-green-950 dark:text-green-300';
          result.innerText = 'Pesan bantuan berhasil dikirim ke admin TECH-C.';
          result.classList.remove('hidden');
        }

        form.reset();

      } catch (err) {
        if (result) {
          result.className = 'mt-4 rounded-2xl bg-red-100 p-4 text-sm font-bold text-red-700 dark:bg-red-950 dark:text-red-300';
          result.innerText = 'Gagal mengirim bantuan: ' + err.message;
          result.classList.remove('hidden');
        }
      }
    });
  }

  document.addEventListener('DOMContentLoaded', async () => {
    await loadPartials();
    await loadHeaderUser();
    await loadPage();
  });
  </script>

</body>
</html>
