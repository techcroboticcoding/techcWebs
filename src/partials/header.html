<header
  x-data="{menuToggle: false}"
  class="sticky top-0 z-[99997] flex w-full items-center justify-between border-b border-slate-200 bg-white px-3 py-2 dark:border-slate-800 dark:bg-slate-950 lg:px-6 lg:py-3"
>
  <!-- KIRI: HAMBURGER + LOGO MOBILE -->
  <div class="flex min-w-0 items-center gap-2">
    <!-- TOMBOL SIDEBAR HP -->
    <button
      type="button"
      @click.stop="sidebarToggle = !sidebarToggle"
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl border border-slate-200 bg-white text-xl font-black text-slate-700 shadow-sm transition hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950 dark:text-white lg:hidden"
      aria-label="Open sidebar"
    >
      ☰
    </button>

    <!-- LOGO MOBILE -->
    <a href="index.html" class="flex min-w-0 items-center gap-2 lg:hidden">
      <img
        src="./images/logo.png"
        alt="TECH-C"
        class="h-9 w-9 shrink-0 rounded-xl object-contain"
      />

      <span class="hidden text-sm font-black text-slate-900 dark:text-white xs:inline">
        TECH-C
      </span>
    </a>
  </div>

  <!-- KANAN: USER -->
  <div class="flex min-w-0 items-center justify-end">
    <div class="relative">
      <a href="profileAdmin.html" class="flex min-w-0 items-center text-slate-700 dark:text-slate-200">
        <!-- FOTO -->
        <span class="mr-2 h-10 w-10 shrink-0 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-800 sm:mr-3 sm:h-11 sm:w-11">
          <img
            id="header_avatar"
            src="https://ui-avatars.com/api/?name=User&background=2563eb&color=fff&bold=true"
            alt="Admin Profile"
            class="h-full w-full object-cover"
            onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Admin+TECH-C&background=2563eb&color=fff&bold=true';"
          />
        </span>

        <!-- NAMA -->
        <span
          id="header_name"
          class="max-w-[92px] truncate text-xs font-bold leading-4 text-slate-800 dark:text-white sm:max-w-[160px] sm:text-sm"
        >
          Loading...
        </span>
      </a>
    </div>
  </div>
</header>
