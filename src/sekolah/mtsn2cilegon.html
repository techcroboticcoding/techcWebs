<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard MIN 1 Cilegon</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f7fb;
}

/* HEADER */

header{
background:linear-gradient(135deg,#2563eb,#06b6d4);
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
box-shadow:0 10px 20px rgba(0,0,0,.1);
}

header h1{
font-size:30px;
}

header a{
text-decoration:none;
background:white;
color:#2563eb;
padding:10px 18px;
border-radius:12px;
font-weight:bold;
}

/* CONTAINER */

.container{
width:95%;
max-width:1400px;
margin:30px auto;
}

/* CARD */

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;

}

.card{

background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.08);

}

.card h2{

font-size:40px;
color:#2563eb;

}

.card p{

margin-top:10px;
color:#666;

}

/* TOOLBAR */

.toolbar{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:15px;

}

.search{

padding:12px 15px;
width:300px;
border:1px solid #ddd;
border-radius:10px;

}

.btn{

padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}

.blue{

background:#2563eb;
color:white;

}

.green{

background:#16a34a;
color:white;

}

/* TABLE */

.table-box{

background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.08);

}

table{

width:100%;
border-collapse:collapse;

}

table th{

background:#2563eb;
color:white;
padding:15px;

}

table td{

padding:15px;
border-bottom:1px solid #eee;

}

table tr:hover{

background:#f8fbff;

}

select{

padding:8px;
border-radius:8px;

}

</style>

</head>

<header>
