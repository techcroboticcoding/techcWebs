<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilih Sekolah</title>
</head>

<script>
if (!localStorage.getItem('token')) {
  window.location.href = './login.html';
}
</script>

<body
  x-data="{ page: 'sekolah', darkMode: false }"
  x-init="
    darkMode = JSON.parse(localStorage.getItem('darkMode'));
    $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))
  "
  :class="{'dark bg-gray-900': darkMode === true}"
>

<!-- INCLUDE HEADER -->
<include src="./partials/header.html"></include>

<!-- CONTENT -->
<main class="p-6 bg-gray-50 dark:bg-gray-900 min-h-screen">

  <!-- TITLE -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-white">
      Pilih Sekolah
    </h1>
    <p class="text-gray-500 text-sm">
      Pilih sekolah untuk melihat data
    </p>
  </div>

  <!-- GRID SEKOLAH -->
  <div id="schoolList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
    
    <!-- LOADING -->
    <p class="text-gray-500">Loading...</p>

  </div>

</main>

<!-- LOAD PARTIAL -->
<script>
async function loadPartials() {
  const includes = document.querySelectorAll('include');
  for (let el of includes) {
    const file = el.getAttribute('src');
    const res = await fetch(file);
    const html = await res.text();
    el.outerHTML = html;
  }
}
loadPartials();
</script>
