<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MIN 1 Cilegon</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:#f3f4f6;
}

header{

background:#2563eb;
color:white;

padding:20px 40px;

display:flex;

justify-content:space-between;
align-items:center;

}

header h1{

font-size:30px;

}

header a{

color:white;
text-decoration:none;

background:white;
color:#2563eb;

padding:10px 18px;

border-radius:10px;

font-weight:bold;

}

.container{

width:95%;
max-width:1400px;

margin:auto;

padding:30px;

}

.info{

background:white;

padding:30px;

border-radius:20px;

margin-bottom:30px;

box-shadow:0 10px 20px rgba(0,0,0,.08);

}

.info h2{

font-size:35px;

color:#2563eb;

margin-bottom:10px;

}

.info p{

color:#666;

}

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:35px;

}

.card{

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 10px 20px rgba(0,0,0,.08);

transition:.3s;

}

.card:hover{

transform:translateY(-5px);

}

.card i{

font-size:40px;

margin-bottom:20px;

}

.card h1{

font-size:45px;

margin-bottom:10px;

}

.blue{

color:#2563eb;

}

.green{

color:#16a34a;

}

.orange{

color:#f59e0b;

}

.red{

color:#dc2626;

}

.menu{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}

.box{

background:white;

padding:30px;

border-radius:20px;

text-align:center;

box-shadow:0 10px 20px rgba(0,0,0,.08);

transition:.3s;

cursor:pointer;

}

.box:hover{

background:#2563eb;
color:white;

}

.box i{

font-size:55px;

margin-bottom:20px;

}

.box h2{

margin-bottom:10px;

}

.box p{

color:#777;

}

.box:hover p{

color:white;

}

</style>

</head>

<body>

<header>

<h1>MIN 1 Cilegon</h1>

<a href="sekolah.html">
← Kembali
</a>

</header>

<div class="container">

<div class="info">

<h2>Dashboard Sekolah</h2>

<p>
Selamat datang di Dashboard Absensi MIN 1 Cilegon.
</p>

</div>

<div class="cards">

<div class="card">

<i class="fa-solid fa-user-graduate blue"></i>

<h1 class="blue">
320
</h1>

<p>Total Pelajar</p>

</div>

<div class="card">

<i class="fa-solid fa-circle-check green"></i>

<h1 class="green">
298
</h1>

<p>Hadir Hari Ini</p>

</div>

<div class="card">

<i class="fa-solid fa-clock orange"></i>

<h1 class="orange">
15
</h1>

<p>Belum Absen</p>

</div>

<div class="card">

<i class="fa-solid fa-circle-xmark red"></i>

<h1 class="red">
7
</h1>

<p>Tidak Hadir</p>

</div>

</div>

<div class="menu">

<div class="box" onclick="location.href='absensi.html'">

<i class="fa-solid fa-calendar-check"></i>

<h2>Absensi</h2>

<p>
Input absensi siswa
</p>

</div>

<div class="box">

<i class="fa-solid fa-users"></i>

<h2>Pelajar</h2>

<p>
Data seluruh siswa
</p>

</div>

<div class="box">

<i class="fa-solid fa-chart-column"></i>

<h2>Laporan</h2>

<p>
Rekap absensi
</p>

</div>

<div class="box">

<i class="fa-solid fa-gear"></i>

<h2>Pengaturan</h2>

<p>
Pengaturan sekolah
</p>

</div>

</div>

</div>

</body>
</html>
